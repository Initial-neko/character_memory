<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Character Memory</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/p0_5.css">
  <link rel="stylesheet" href="/static/p0_6.css">
  <link rel="stylesheet" href="/static/p0_7.css">
  <link rel="stylesheet" href="/static/p0_8.css">
  <link rel="stylesheet" href="/static/p0_11.css">
  <link rel="stylesheet" href="/static/p0_15.css">
  <link rel="stylesheet" href="/static/p0_16.css">
  <link rel="stylesheet" href="/static/voice.css">
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">CM</div><div><strong>Character Memory</strong><span>Persistent AI Person</span></div></div>
      <div class="sidebar-title">Characters</div>
      <nav id="characterList" class="character-list" aria-label="Characters"></nav>
      <div class="sidebar-foot">Phase 1 · Prove the Person</div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="character-heading"><div id="headerAvatar" class="header-avatar">R</div><div><h1 id="characterName">Rin</h1><p id="characterIdentity">Persistent AI Person</p></div></div>
        <div class="topbar-actions"><span id="nowText" class="now"></span><button id="voiceCallButton" class="ghost-button voice-call-button" type="button" title="语音通话">📞</button><button id="conversationSearchButton" class="ghost-button search-button" type="button" title="搜索当前聊天">🔎 <span class="search-label">搜索</span></button><button id="globalSearchButton" class="ghost-button search-button" type="button" title="搜索所有聊天">全局搜索</button><button id="runtimeButton" class="ghost-button" type="button">Runtime</button></div>
      </header>
      <section id="chat" class="chat" aria-live="polite"></section>
      <div class="composer-wrap">
        <form id="composer" class="composer"><textarea id="messageInput" rows="1" placeholder="发送消息" autocomplete="off"></textarea><button id="sendButton" type="submit">发送</button></form>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 群聊输入 @ 可点名</div>
      </div>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true"><header class="drawer-header"><div><h2 id="drawerTitle">详情</h2><p id="drawerSubtitle"></p></div><button id="drawerClose" class="icon-button" type="button" aria-label="关闭">×</button></header><div id="drawerBody" class="drawer-body"></div></aside>

  <div id="voiceCallOverlay" class="voice-call-overlay hidden" role="dialog" aria-modal="true" aria-label="语音通话">
    <div class="voice-call-card">
      <section class="voice-call-identity">
        <div id="voiceCallAvatar" class="voice-call-avatar">R</div>
        <h2 id="voiceCallName">Rin</h2>
        <div id="voiceCallStatus" class="voice-call-status">正在连接…</div>
        <div id="voiceCallMetrics" class="voice-call-metrics"></div>
        <button id="voiceHangupButton" class="voice-hangup" type="button">结束通话</button>
      </section>
      <section class="voice-call-detail" aria-label="当前语音对话">
        <div class="voice-call-detail-head"><strong>当前对话</strong><span>语音内容会同时写入聊天历史</span></div>
        <div id="voiceCallLog" class="voice-call-log" aria-live="polite"></div>
        <div id="voiceCallTranscript" class="voice-call-transcript">直接说话即可；停顿后会自动发送。</div>
      </section>
    </div>
  </div>

  <template id="typingTemplate"><article class="message-row assistant typing-row"><div class="avatar">AI</div><div class="bubble-wrap"><div class="bubble typing"><span></span><span></span><span></span></div><div class="message-meta">正在输入中…</div></div></article></template>

  <!-- One core controller; feature modules register behavior instead of overriding globals. -->
  <script src="/static/app.js" defer></script>
  <script src="/static/persona.js" defer></script>
  <script src="/static/unread.js" defer></script>
  <script src="/static/stickers.js" defer></script>
  <script src="/static/images.js" defer></script>
  <script src="/static/groups.js" defer></script>
  <script src="/static/realtime_reconcile.js" defer></script>
  <script src="/static/wake.js" defer></script>
  <script src="/static/mentions.js" defer></script>
  <script src="/static/group_settings.js" defer></script>
  <script src="/static/avatars.js" defer></script>
  <script src="/static/search.js" defer></script>
  <script src="/static/intent.js" defer></script>
  <script src="/static/voice.js" defer></script>
</body>
</html>
