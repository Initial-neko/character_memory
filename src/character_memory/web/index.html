<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Character Memory</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/p0_5.css">
  <link rel="stylesheet" href="/static/p0_6.css">
  <link rel="stylesheet" href="/static/p0_7.css">
  <link rel="stylesheet" href="/static/p0_8.css">
  <link rel="stylesheet" href="/static/p0_11.css">
</head>
<body class="startup-pending">
  <div id="startupGate" class="startup-gate" role="status" aria-live="polite" aria-busy="true">
    <div class="startup-card">
      <div class="startup-mark">CM</div>
      <h1>Character Memory</h1>
      <p id="startupStatus" class="startup-status">正在唤醒人物…</p>
      <p id="startupDetail" class="startup-detail">正在加载记忆、人物设定与表情资源</p>
      <div class="startup-progress" aria-hidden="true"><span></span></div>
      <div class="startup-actions">
        <button id="startupRetry" class="ghost-button hidden" type="button">重试</button>
        <button id="startupContinue" class="ghost-button hidden" type="button">进入只读界面</button>
      </div>
    </div>
  </div>

  <div class="workspace">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">CM</div><div><strong>Character Memory</strong><span>Persistent AI Person</span></div></div>
      <div class="sidebar-title">Characters</div>
      <nav id="characterList" class="character-list" aria-label="Characters"></nav>
      <div class="sidebar-foot">Phase 1 · Prove the Person</div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="character-heading"><div id="headerAvatar" class="header-avatar">R</div><div><h1 id="characterName">Rin</h1><p id="characterIdentity">Persistent AI Person</p></div></div>
        <div class="topbar-actions"><span id="nowText" class="now"></span><button id="runtimeButton" class="ghost-button" type="button">Runtime</button></div>
      </header>
      <section id="chat" class="chat" aria-live="polite"></section>
      <div class="composer-wrap">
        <form id="composer" class="composer"><textarea id="messageInput" rows="1" placeholder="发送消息" autocomplete="off"></textarea><button id="sendButton" type="submit">发送</button></form>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true"><header class="drawer-header"><div><h2 id="drawerTitle">详情</h2><p id="drawerSubtitle"></p></div><button id="drawerClose" class="icon-button" type="button" aria-label="关闭">×</button></header><div id="drawerBody" class="drawer-body"></div></aside>

  <template id="typingTemplate"><article class="message-row assistant typing-row"><div class="avatar">AI</div><div class="bubble-wrap"><div class="bubble typing"><span></span><span></span><span></span></div><div class="message-meta">正在输入中…</div></div></article></template>

  <!-- Startup only owns readiness presentation; app.js remains the chat controller. -->
  <script src="/static/startup.js" defer></script>
  <!-- One core controller; feature modules register behavior instead of overriding globals. -->
  <script src="/static/app.js" defer></script>
  <script src="/static/persona.js" defer></script>
  <script src="/static/unread.js" defer></script>
  <script src="/static/stickers.js" defer></script>
  <script src="/static/images.js" defer></script>
  <script src="/static/groups.js" defer></script>
  <script src="/static/group_settings.js" defer></script>
  <script src="/static/intent.js" defer></script>
</body>
</html>
