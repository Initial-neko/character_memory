<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W2 C · 发送确认设计提案</title>
<link rel="stylesheet" href="../../../src/character_memory/web/ui.css"><link rel="stylesheet" href="../../../src/character_memory/web/frontend_v2.css">
<style>
*{box-sizing:border-box}body{margin:0}.proposal{max-width:1240px;margin:auto;padding:28px}.proposal h1{font-size:25px;margin:8px 0}.eyebrow,.scope{color:var(--ui-muted);font-size:12px}.intro{font-size:14px;line-height:1.7;color:var(--ui-muted);max-width:760px}.states{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.states button{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:9px;padding:9px 14px;color:var(--ui-muted);cursor:pointer}.states button.selected{background:var(--ui-surface-sunken);border-color:var(--ui-line-strong);color:var(--ui-accent)}.examples{display:grid;grid-template-columns:1fr 1fr;gap:22px}.chat-example{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-r-lg);overflow:hidden}.chat-head{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--ui-line)}.avatar{width:34px;height:34px;background:var(--ui-surface-sunken);border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--ui-accent)}.chat-head strong{display:block;font-size:14px}.chat-head small{font-size:11px;color:var(--ui-muted)}.history{padding:26px 20px 22px;min-height:275px}.bubble{margin-left:auto;max-width:93%;border:1px solid var(--ui-line-strong);border-radius:15px 15px 4px 15px;background:var(--ui-surface-sunken);padding:14px 16px;font-size:14px;line-height:1.7}.attachment{margin-top:10px;padding-top:9px;border-top:1px solid var(--ui-line-strong);font-size:12px;color:var(--ui-muted)}.receipt{margin:10px 0 0 auto;max-width:93%;padding:13px 15px;border:1px solid var(--ui-line);border-radius:12px;background:var(--ui-surface-soft)}.receipt strong{font-size:13px}.receipt p{font-size:12px;line-height:1.65;margin:6px 0 12px;color:var(--ui-muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font:inherit;font-size:12px;padding:8px 12px;min-height:36px;border-radius:8px;border:1px solid var(--ui-line-strong);cursor:pointer;background:var(--ui-surface);color:var(--ui-accent)}.actions .primary{background:var(--ui-accent);border-color:var(--ui-accent);color:white}.actions button:disabled{cursor:wait;opacity:.65}.proposal-composer{display:flex;gap:10px;align-items:center;border-top:1px solid var(--ui-line);padding:16px 20px;background:var(--ui-surface-soft)}.proposal-composer textarea{font:inherit;font-size:13px;resize:none;min-width:0;flex:1;border:1px solid var(--ui-line);border-radius:10px;padding:12px;background:white;color:var(--ui-text)}.proposal-composer button{min-height:44px;background:var(--ui-accent);border:0;border-radius:9px;color:white;padding:11px 13px;cursor:pointer;font-size:12px}.note{font-size:12px;line-height:1.8;color:var(--ui-muted);margin-top:18px}.toast{color:var(--ui-accent);font-size:12px;min-height:18px;margin-top:12px}button:focus-visible,textarea:focus-visible{outline:3px solid var(--ui-focus);outline-offset:3px}@media(max-width:650px){.proposal{padding:18px 14px}.proposal h1{font-size:21px}.examples{grid-template-columns:1fr;gap:18px}.history{padding:20px 14px;min-height:250px}.chat-head,.proposal-composer{padding:14px}.intro{font-size:13px}.actions button{min-height:44px}.states{margin:16px 0}.states button{font-size:12px;padding:8px 10px}.bubble,.receipt{max-width:97%}}
</style></head><body class="cm-user-page"><main class="proposal">
<div class="eyebrow">设计提案 · 示例内容 · 不会连接服务或发送消息</div><h1>发送状态留在原消息旁</h1><p class="intro">重试继续原来的发送；有意再发一次，则从输入框创建一条新发送。刷新后，未确认的原发送仍可找回。</p>
<nav class="states" aria-label="原型状态"><button data-state="unknown">结果待确认</button><button data-state="retrying">正在重试</button><button data-state="accepted">已送达</button><button data-state="rejected">明确未发送</button></nav>
<section class="examples"></section><p class="note">范围：私聊 / 群聊中的文字、图片 / 贴纸、生活引用、无临时画面的语音转写。只批准发送状态组件及交互，不改变页面导航或聊天布局。<br>“已送达”只表示消息已保存，不表示伙伴已经回答。所有按钮在本页仅演示状态，不会产生真实请求。</p><div class="toast" role="status" aria-live="polite"></div>
</main><script>
const variants={unknown:{title:'发送结果待确认',text:'还没收到确认。重试会继续这一次发送，不会另建一条。',primary:'重试原发送',secondary:'另写一条'},retrying:{title:'正在确认原发送…',text:'正在沿用原来的发送记录，请稍候。',primary:'正在确认…',secondary:'另写一条'},accepted:{title:'已送达',text:'消息已保存，接下来等待伙伴回应。'},rejected:{title:'未能发送',text:'服务已明确拒绝这次发送。内容保留，编辑后将作为一条新消息发送。',primary:'编辑为新消息',secondary:'保留草稿'}};
let current=new URLSearchParams(location.search).get('state')||'unknown';
function render(state){current=state in variants?state:'unknown';const v=variants[current];document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===current));document.querySelector('.examples').innerHTML=['私聊 · momo','群聊 · momo、rin'].map((label,i)=>`<article class="chat-example"><header class="chat-head"><div class="avatar">${i?'群':'M'}</div><div><strong>${label}</strong><small>发送状态组件 · 示例</small></div></header><div class="history"><div class="bubble">${i?'@rin ':''}明天的聚会我有点紧张，想先和你们练习一下。${i?'': '<div class="attachment">图片 · 聚会准备.png</div>'}</div><section class="receipt" role="status"><strong>${v.title}</strong><p>${v.text}</p>${v.primary?`<div class="actions"><button class="primary" data-retry ${current==='retrying'?'disabled':''} title="${current==='rejected'?'把保留的内容放回输入框；下次发送使用新身份':'继续原来的发送，保持内容和请求身份不变'}">${v.primary}</button><button data-new title="原发送继续保留；输入框中的新发送使用独立身份">${v.secondary}</button></div>`:''}</section></div><footer class="proposal-composer"><textarea rows="1" aria-label="新消息" placeholder="写一条新消息…"></textarea><button data-send title="新消息：每次有意发送都创建独立身份">发送</button></footer></article>`).join('');document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{if(current==='rejected'){b.closest('article').querySelector('textarea').value='明天的聚会我有点紧张，想先和你们练习一下。';b.closest('article').querySelector('textarea').focus();return;}render('retrying');setTimeout(()=>render('accepted'),900)});document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{b.closest('article').querySelector('textarea').focus();document.querySelector('.toast').textContent=current==='rejected'?'演示：草稿继续保留。':'演示：原发送仍可重试。新输入会作为另一条发送。'});document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>document.querySelector('.toast').textContent='仅为设计原型：没有发出真实消息。')}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));render(current);
</script></body></html>
