<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物生活 · Character Memory</title><link rel="stylesheet" href="/static/ui.css"><link rel="stylesheet" href="/static/life.css"><link rel="stylesheet" href="/static/reading_v2.css"><link rel="stylesheet" href="/static/frontend_v2.css"></head>
<body class="life-page">
<aside class="life-nav" aria-label="生活导航">
  <nav class="life-page-nav" aria-label="生活页面">
    <a href="/">聊天</a>
    <a class="active" href="/life" aria-current="page">生活记录</a>
    <a href="/life?view=changes">记忆与变化</a>
    <a href="/sources">订阅阅读</a>
  </nav>
  <section class="life-character-section" aria-label="人物选择">
    <h2>我关注的人物</h2>
    <nav id="lifeCharacters" class="life-character-list" aria-label="选择人物"></nav>
  </section>
</aside>
<main class="life-main">
  <header class="life-header">
    <div class="identity">
      <div id="avatar" class="avatar" aria-hidden="true">人</div>
      <div class="identity-copy">
        <p class="eyebrow">生活与记忆</p>
        <h1 id="heading">人物生活</h1>
        <div class="identity-controls"><span id="dateLabel"></span><label>当前人物 <select id="character" aria-label="选择人物"></select></label></div>
      </div>
    </div>
    <p class="notice">只呈现已有记录；来源或时间缺失时会明确标注。</p>
  </header>
  <div class="toolbar">
    <div class="date-control"><button id="previous" aria-label="前一天">‹</button><button id="today">今天</button><button id="next" aria-label="后一天">›</button><input id="day" type="date" aria-label="选择日期"></div>
    <form id="searchForm" role="search"><input id="search" type="search" placeholder="搜索经历" maxlength="200" aria-label="搜索经历"><button type="submit">搜索</button></form>
  </div>
  <div class="columns">
    <section class="records" aria-label="人物生活时线">
      <div class="tabs" role="tablist" aria-label="生活视角">
        <button data-view="life" role="tab" aria-selected="true">生活记录</button>
        <button data-view="changes" role="tab" aria-selected="false">记忆与变化</button>
        <button data-view="relationships" role="tab" aria-selected="false">关系经历</button>
        <button data-view="intents" role="tab" aria-selected="false">未来意图</button>
      </div>
      <p class="subtitle">按时间查看已记录的事件、来源和状态变化。</p>
      <div class="filters" aria-label="渠道筛选"><button data-channel="ALL" aria-pressed="true">全部</button><button data-channel="DIRECT" aria-pressed="false">私聊</button><button data-channel="GROUP" aria-pressed="false">群聊</button><button data-channel="SPACE" aria-pressed="false">Space</button><button data-channel="WORLD" aria-pressed="false">World</button></div>
      <label id="peerLabel" hidden>互动对象 <select id="peer" aria-label="筛选互动对象"><option value="">全部对象</option></select></label>
      <section id="relationshipReview" class="memory-card" aria-label="关系近期回顾" aria-live="polite" hidden></section>
      <p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>重新加载</button>
      <div id="timeline" class="timeline"></div><button id="more" hidden>加载更多</button>
      <p class="footnote">计划与已发生经历分开展示。没有记录的部分保持未知。</p>
    </section>
    <aside id="details" class="details" aria-label="经历详情" aria-live="polite"><p class="empty-detail">选择一条经历，查看原始来源、结果与关联变化。</p></aside>
  </div>
</main>
<script src="/static/life.js" defer></script>
<script src="/static/frontend_v2.js" defer></script>
</body></html>
