<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物生活 · Character Memory</title><link rel="stylesheet" href="/static/life.css"></head>
<body><aside class="life-nav"><a class="brand" href="/">♧ <span>Character Memory</span></a><nav><a href="/">◯ <span>聊天</span></a><a href="/?view=space">◇ <span>Space</span></a><a href="/sources">◎ <span>世界</span></a><a class="active" href="/life" aria-current="page">▣ <span>人物生活</span></a><a href="/life?view=changes" title="查看经历关联的记忆与状态变化">▤ <span>记忆</span></a></nav></aside>
<main><header><div class="identity"><div id="avatar" class="avatar" aria-hidden="true">人</div><div><h1 id="heading">人物生活</h1><div class="identity-controls"><span id="dateLabel"></span><select id="character" aria-label="选择人物"></select></div></div></div><p class="notice">真实记录 · 来源缺失时明确标注</p></header>
<div class="toolbar"><div class="date-control"><button id="previous" aria-label="前一天">‹</button><button id="today">今天</button><button id="next" aria-label="后一天">›</button><input id="day" type="date" aria-label="选择日期"></div><form id="searchForm" role="search"><input id="search" type="search" placeholder="搜索经历" maxlength="200" aria-label="搜索经历"><button type="submit">搜索</button></form></div>
<div class="columns"><section class="records"><div class="tabs" role="tablist" aria-label="生活视角"><button data-view="life" role="tab" aria-selected="true">生活记录</button><button data-view="changes" role="tab" aria-selected="false">记忆与变化</button><button data-view="relationships" role="tab" aria-selected="false">关系经历</button><button data-view="intents" role="tab" aria-selected="false">未来意图</button></div><p class="subtitle">从真实事件观察她的生活与变化</p><div class="filters" aria-label="渠道筛选"><button data-channel="ALL" aria-pressed="true">全部</button><button data-channel="DIRECT" aria-pressed="false">私聊</button><button data-channel="GROUP" aria-pressed="false">群聊</button><button data-channel="SPACE" aria-pressed="false">Space</button><button data-channel="WORLD" aria-pressed="false">World</button></div><label id="peerLabel" hidden>互动对象 <select id="peer" aria-label="筛选互动对象"><option value="">全部对象</option></select></label><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>重新加载</button><div id="timeline" class="timeline"></div><button id="more" hidden>加载更多</button><p class="footnote">只呈现已记录的事实；缺失信息不补写。计划与已发生经历分开展示。</p></section><aside id="details" class="details" aria-label="经历详情"><p class="empty-detail">选择一条经历，查看来源、结果与变化。</p></aside></div></main><script src="/static/life.js"></script></body></html>
