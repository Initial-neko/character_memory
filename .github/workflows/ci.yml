name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install canonical runtime dependencies
        run: uv sync --extra all

      - name: Prepare test evidence directory
        run: mkdir -p artifacts/core-visual-evidence

      - name: Run tests
        env:
          # faulthandler dumps every Python thread's stack on SIGSEGV/SIGABRT.
          PYTHONFAULTHANDLER: "1"
          # Keep pre-crash output in the archived log ordered with that dump.
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          set +e
          uv run pytest -q --junitxml=artifacts/core-visual-evidence/junit-linux.xml 2>&1 | tee artifacts/core-visual-evidence/pytest-linux.log
          pytest_status=${PIPESTATUS[0]}
          printf '%s\n' "$pytest_status" > artifacts/core-visual-evidence/pytest-linux-exit-code.txt
          if [ "$pytest_status" -ge 128 ]; then
            # A signal exit (139 = SIGSEGV) leaves a kernel record naming the
            # faulting address and native module, which faulthandler cannot show.
            {
              printf 'pytest exited via signal, status: %s\n' "$pytest_status"
              ulimit -a
              cat /proc/sys/kernel/core_pattern
              dmesg 2>&1 | tail -n 50
            } 2>&1 | tee -a artifacts/core-visual-evidence/pytest-linux.log
          fi
          exit "$pytest_status"

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-junit-linux
          path: artifacts/core-visual-evidence/
          if-no-files-found: warn

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install core and media dependencies
        run: uv sync --extra api --extra dev --extra media

      - name: Prepare test evidence directory
        run: New-Item -ItemType Directory -Path artifacts/core-visual-evidence -Force | Out-Null

      - name: Run Windows-sensitive smoke tests
        run: uv run pytest -q tests/test_cross_platform_scripts.py tests/test_media_bootstrap.py tests/test_sticker_import_cli.py --junitxml=artifacts/core-visual-evidence/junit-windows-smoke.xml

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-junit-windows-smoke
          path: artifacts/core-visual-evidence/junit-windows-smoke.xml
          if-no-files-found: warn

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra api --extra dev --extra browser

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Prepare browser evidence directory
        run: mkdir -p artifacts/core-visual-evidence

      - name: Run browser smoke
        env:
          RUN_PLAYWRIGHT: "1"
          GROUP_ENTRY_EVIDENCE_DIR: artifacts/core-visual-evidence/group-entry-sse
          DESKTOP_UI_EVIDENCE_DIR: artifacts/core-visual-evidence/desktop-space-builder
        run: uv run pytest -q tests/test_p0_17b_playwright.py tests/test_p0_17c_playwright.py tests/test_chat_ui_playwright.py tests/test_settings_playwright.py tests/test_world_browser_playwright.py tests/test_character_archive_notice_playwright.py tests/test_dev_console_playwright.py tests/test_group_failure_playwright.py tests/test_group_entry_sse_browser.py tests/test_ensemble_recovery_playwright.py tests/test_group_scene_browser.py tests/test_space_reconciliation_playwright.py tests/test_mobile_views_playwright.py tests/test_sticker_removal_playwright.py tests/test_sticker_normalization_browser.py tests/test_rss_browser.py tests/test_character_life_browser.py tests/test_frontend_v2_browser.py tests/test_profile_v2_browser.py tests/test_space_post_detail_browser.py tests/test_space_mixed_feed_browser.py tests/test_desktop_space_builder_browser.py tests/test_world_continuation_life_browser.py tests/test_world_candidate_actions_browser.py tests/test_call_invitations_browser.py --browser chromium --junitxml=artifacts/core-visual-evidence/junit-browser-smoke.xml

      - name: Upload browser visual evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-visual-evidence
          path: artifacts/core-visual-evidence/
          if-no-files-found: warn
