[project]
name = "character-memory"
version = "0.4.1"
description = "Experimental persistent AI person runtime with language memory, vector recall and simulated life."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "numpy==2.5.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
# These optional stacks are not part of the current Voice V0 compatibility
# baseline yet. Keep them bounded until they have their own tested lock step.
local-embedding = ["sentence-transformers>=3.0,<6"]
api = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]
# sherpa-onnx is the Python binding. sherpa-onnx-core carries the matching
# native shared libraries (including ONNX Runtime on Windows). Keep both direct
# and version-aligned so mirrors/lockfiles cannot silently omit the native core.
media = [
  "sherpa-onnx==1.13.5",
  "sherpa-onnx-core==1.13.5",
]
ui = ["streamlit>=1.37,<2"]
dev = ["pytest==9.1.1"]
all = [
  "sentence-transformers>=3.0,<6",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "sherpa-onnx==1.13.5",
  "sherpa-onnx-core==1.13.5",
  "streamlit>=1.37,<2",
  "pytest==9.1.1",
]

[project.scripts]
character-memory = "character_memory.cli:main"
character-media = "character_memory.media_bootstrap:main"
character-dev = "character_memory.dev_server:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
character_memory = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/stickers/default/*.yaml",
  "web/stickers/default/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
