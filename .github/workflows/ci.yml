name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install canonical runtime dependencies
        run: uv sync --extra all

      - name: Prepare test evidence directory
        run: mkdir -p artifacts/core-visual-evidence

      - name: Run tests
        run: uv run pytest -q --junitxml=artifacts/core-visual-evidence/junit-linux.xml

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-junit-linux
          path: artifacts/core-visual-evidence/junit-linux.xml
          if-no-files-found: warn

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install core and media dependencies
        run: uv sync --extra api --extra dev --extra media

      - name: Prepare test evidence directory
        run: New-Item -ItemType Directory -Path artifacts/core-visual-evidence -Force | Out-Null

      - name: Run Windows-sensitive smoke tests
        run: uv run pytest -q tests/test_cross_platform_scripts.py tests/test_media_bootstrap.py tests/test_sticker_import_cli.py --junitxml=artifacts/core-visual-evidence/junit-windows-smoke.xml

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-junit-windows-smoke
          path: artifacts/core-visual-evidence/junit-windows-smoke.xml
          if-no-files-found: warn

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra api --extra dev --extra browser

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Prepare browser evidence directory
        run: mkdir -p artifacts/core-visual-evidence

      - name: Run browser smoke
        env:
          RUN_PLAYWRIGHT: "1"
        run: uv run pytest -q tests/test_p0_17b_playwright.py tests/test_p0_17c_playwright.py tests/test_chat_ui_playwright.py tests/test_settings_playwright.py tests/test_world_browser_playwright.py tests/test_character_archive_notice_playwright.py tests/test_dev_console_playwright.py tests/test_group_failure_playwright.py tests/test_ensemble_recovery_playwright.py tests/test_space_reconciliation_playwright.py tests/test_mobile_views_playwright.py tests/test_sticker_removal_playwright.py --browser chromium --junitxml=artifacts/core-visual-evidence/junit-browser-smoke.xml

      - name: Upload browser visual evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-visual-evidence
          path: artifacts/core-visual-evidence/
          if-no-files-found: warn
