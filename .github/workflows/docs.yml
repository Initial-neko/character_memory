name: Documentation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained docs and PR impact
        run: python scripts/check_docs.py --event "$GITHUB_EVENT_PATH"
      - name: Test documentation checker
        run: python -m unittest discover -s tests -p test_doc_checks.py
