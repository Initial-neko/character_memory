<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Character Memory</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/p0_5.css">
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CM</div>
        <div>
          <strong>Character Memory</strong>
          <span>Persistent AI Person</span>
        </div>
      </div>
      <div class="sidebar-title">Characters</div>
      <nav id="characterList" class="character-list" aria-label="Characters"></nav>
      <div class="sidebar-foot">Phase 1 · Prove the Person</div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="character-heading">
          <div id="headerAvatar" class="header-avatar">R</div>
          <div>
            <h1 id="characterName">Rin</h1>
            <p id="characterIdentity">Persistent AI Person</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="nowText" class="now"></span>
          <button id="runtimeButton" class="ghost-button" type="button">Runtime</button>
        </div>
      </header>

      <section id="chat" class="chat" aria-live="polite"></section>

      <div class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="messageInput" rows="1" placeholder="发送消息" autocomplete="off"></textarea>
          <button id="sendButton" type="submit">发送</button>
        </form>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <header class="drawer-header">
      <div>
        <h2 id="drawerTitle">详情</h2>
        <p id="drawerSubtitle"></p>
      </div>
      <button id="drawerClose" class="icon-button" type="button" aria-label="关闭">×</button>
    </header>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <template id="typingTemplate">
    <article class="message-row assistant typing-row">
      <div class="avatar">AI</div>
      <div class="bubble-wrap">
        <div class="bubble typing"><span></span><span></span><span></span></div>
        <div class="message-meta">正在输入中…</div>
      </div>
    </article>
  </template>

  <script src="/static/app.js" defer></script>
  <script src="/static/p0_5.js" defer></script>
</body>
</html>
