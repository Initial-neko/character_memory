[project]
name = "character-memory"
version = "0.4.1"
description = "Experimental persistent AI person runtime with language memory, vector recall and simulated life."
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.0,<6"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui = ["streamlit>=1.37,<2"]
dev = ["pytest>=8.0,<9"]
browser = ["pytest-playwright>=0.5,<1"]
all = [
  "sentence-transformers>=3.0,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.37,<2",
  "pytest>=8.0,<9",
  "pytest-playwright>=0.5,<1",
]

[project.scripts]
character-memory = "character_memory.cli:main"

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
character_memory = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/stickers/default/*.yaml",
  "web/stickers/default/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "browser: real-browser Playwright smoke tests",
]
