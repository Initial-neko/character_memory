[project]
name = "character-memory"
version = "0.4.0"
description = "Experimental persistent AI person runtime with language memory, vector recall and simulated life."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
ui = ["streamlit>=1.37"]
dev = ["pytest>=8.0"]
all = [
  "sentence-transformers>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.37",
  "pytest>=8.0",
]

[project.scripts]
character-memory = "character_memory.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
