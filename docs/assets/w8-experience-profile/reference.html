<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相处偏好 · 设计提案</title>
<link rel="stylesheet" href="../../../src/character_memory/web/ui.css"><link rel="stylesheet" href="../../../src/character_memory/web/frontend_v2.css">
<style>
*{box-sizing:border-box}body{margin:0}.proposal{max-width:1080px;margin:0 auto;padding:30px 30px 50px}.eyebrow{color:var(--ui-muted);font-size:12px}h1{font-size:25px;letter-spacing:-.6px;margin:9px 0 10px}.intro{font-size:14px;color:var(--ui-muted);line-height:1.75;max-width:800px}.states{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0}.states button{border:1px solid var(--ui-line);background:white;border-radius:9px;color:var(--ui-muted);padding:9px 12px;font-size:12px;cursor:pointer}.states .active{background:var(--ui-surface-sunken);color:var(--ui-accent);border-color:var(--ui-line-strong)}
.card{padding:0;max-width:650px;margin:0 auto;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-r-lg);box-shadow:0 8px 35px rgba(35,25,75,.05);overflow:hidden}.card-head{padding:24px 28px 17px;border-bottom:1px solid var(--ui-line)}.card-head small{color:var(--ui-muted);font-size:12px}.card h2{font-size:22px;margin:7px 0 9px;letter-spacing:-.5px}.card p{color:var(--ui-muted);font-size:13px;line-height:1.7;margin:0}.body{padding:21px 28px}.banner{padding:12px 14px;border:1px solid var(--ui-line-strong);background:var(--ui-hover);border-radius:10px;margin-bottom:20px;font-size:13px;line-height:1.65;color:var(--ui-text)}.banner.error{background:#fff7f8;border-color:#ebcbd4;color:#77324b}.banner strong{display:block;margin-bottom:3px}.group{border:0;padding:0;margin:0 0 21px;min-width:0}.group legend{font-weight:650;font-size:14px;padding:0;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}.choice{display:flex;align-items:center;gap:6px;min-height:44px;padding:10px 11px;border:1px solid var(--ui-line);border-radius:10px;cursor:pointer;color:var(--ui-muted);font-size:13px;white-space:nowrap}.choice:has(input:checked){background:var(--ui-hover);border-color:var(--ui-accent);color:var(--ui-accent);font-weight:650}.choice input{accent-color:var(--ui-accent);margin:0;width:14px;height:14px}.hint{margin-top:8px!important;font-size:12px!important}.summary{background:var(--ui-surface-soft);border:1px solid var(--ui-line);border-radius:10px;padding:13px 15px}.summary strong{font-size:13px;display:block;margin-bottom:5px}.foot{padding:16px 28px;border-top:1px solid var(--ui-line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}.action{font:inherit;font-size:13px;min-height:44px;border:1px solid var(--ui-line);background:white;color:var(--ui-muted);border-radius:10px;padding:10px 15px;cursor:pointer}.action.primary{background:var(--ui-accent);color:white;border-color:var(--ui-accent);margin-left:auto}.action.danger{color:#92364f;border-color:#ebcbd4}.action:disabled{opacity:.58;cursor:default}.text-button{border:0;background:none;color:var(--ui-muted);font:inherit;font-size:12px;padding:10px 0;cursor:pointer;min-height:44px}.note{font-size:12px;color:var(--ui-muted);line-height:1.8;max-width:650px;margin:17px auto 0}.history-row{padding:16px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ui-line)}.history-row:last-child{border:0}.history-row div{flex:1}.history-row strong{display:block;font-size:14px;margin-bottom:5px}.history-row .action{flex-shrink:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}button:focus-visible,label:focus-within{outline:3px solid var(--ui-focus);outline-offset:3px}.contract{font-size:12px;color:var(--ui-muted);margin:10px 0 0}
@media(max-width:620px){.proposal{padding:20px 14px 30px}h1{font-size:22px}.intro{font-size:13px}.states{gap:6px;margin:17px 0}.states button{padding:8px 9px}.card-head{padding:20px 18px 16px}.card h2{font-size:21px}.body{padding:18px}.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{padding:10px 7px;font-size:12px;gap:4px}.foot{padding:14px 18px;gap:8px}.foot .action{padding:10px 12px}.note{padding:0 3px}.history-row{align-items:flex-start}.history-row .action{max-width:115px}.group{margin-bottom:20px}}
</style></head><body class="cm-user-page"><main class="proposal"><div class="eyebrow">W8 设计提案 · 示例内容 · 尚未接入产品</div><h1>用你舒服的方式，慢慢熟悉</h1><p class="intro">只选择希望的相处方式，不给你贴性格标签。可以跳过，以后随时调整；伙伴也保留自己的观点。</p><nav class="states" aria-label="设计状态"></nav><section class="card" aria-label="相处偏好设计"></section><p class="note">本稿范围：首次选择与再次打开的相处偏好面板、版本记录及清除确认；桌面 1280×900 / 手机 390×844。聊天建议依赖 W7，本稿不批准或实现建议条、聊天入口和其他页面。<br>所有按钮仅模拟交互；不会保存偏好、读取真实用户数据或调用模型。保存成功在下一次回复使用新选择，正在生成的回复不变。</p></main>
<script>
const states={initial:'首次选择',edit:'再次调整',saving:'保存中',saved:'已保存',error:'保存失败',conflict:'版本冲突',history:'版本记录',restore:'恢复确认',clear:'清除确认',cleared:'已清除'};
let current=new URLSearchParams(location.search).get('state')||'initial';let values={};
const dims=[['tone','表达风格',[['NATURAL','自然'],['CUTE','可爱'],['','暂不选择']],'轻松自然，或多一点可爱的表达。'],['energy','相处节奏',[['QUIET','安静'],['LIVELY','热闹'],['','暂不选择']],'少一些打扰，或多一点主动的话题。'],['verbosity','回答长度',[['BRIEF','简短'],['BALANCED','适中'],['DETAILED','丰富'],['','暂不选择']],'可以展开，也可以先说重点。']];
function groups(){return dims.map(([key,title,options,hint])=>`<fieldset class="group"><legend>${title}</legend><div class="choices ${options.length===4?'four':''}">${options.map(([value,label])=>`<label class="choice"><input type="radio" name="${key}" value="${value}" ${values[key]===value?'checked':''} ${current==='saving'?'disabled':''}>${label}</label>`).join('')}</div><p class="hint">${hint}</p></fieldset>`).join('')}
function render(state,preserve=false){current=state in states?state:'initial';if(!preserve)values=current==='initial'||current==='cleared'?{tone:'',energy:'',verbosity:''}:{tone:'CUTE',energy:'QUIET',verbosity:'BRIEF'};
document.querySelector('.states').innerHTML=Object.entries(states).map(([s,t])=>`<button data-state="${s}" class="${s===current?'active':''}">${t}</button>`).join('');
let content='',footer='';const head=`<header class="card-head"><small>${current==='initial'?'第一次见面 · 可跳过':'你的选择 · 所有伙伴共用'}</small><h2>相处偏好</h2><p>偏好影响表达与节奏，不改变伙伴是谁。<br>没有选择的部分，让相处自然发生。</p></header>`;
if(current==='history'||current==='restore'){content=`<div class="banner">恢复会成为一次新修改；已清除的选择无法从这里找回。</div><div class="history-row"><div><strong>当前选择</strong><p>可爱 · 安静 · 简短<br>今天 14:20 · 你主动选择</p></div><span class="contract">正在使用</span></div><div class="history-row"><div><strong>上一次选择</strong><p>自然 · 热闹 · 适中<br>昨天 19:05 · 你主动选择</p></div><button class="action" data-restore>恢复这一版</button></div><div class="banner" id="restore-confirm" ${current==='restore'?'':'hidden'}><strong>恢复为“自然 · 热闹 · 适中”？</strong>现有选择仍保留在记录中；下一次回复使用恢复后的选择。<div><button class="action" data-confirm-restore>确认恢复</button></div></div>`;footer=`<button class="action" data-state="edit">返回偏好</button>`}
else if(current==='clear'){content=`<div class="banner error"><strong>清除所有相处偏好？</strong>当前选择与历史偏好快照都会被删除，之后无法恢复。伙伴的身份和聊天记录不会因此改变。</div><div class="summary"><strong>这次将清除</strong><p>可爱 · 安静 · 简短，以及之前的偏好版本。</p></div>`;footer=`<button class="action" data-state="edit">取消</button><button class="action danger" style="margin-left:auto" data-state="cleared">确认清除</button>`}
else if(current==='cleared'){content=`<div class="banner"><strong>已清除相处偏好</strong>从下一次回复起，不再使用旧选择；正在生成的回复不变。</div><p>你可以重新选择，也可以先自然地聊一聊。</p>`;footer=`<button class="action" data-state="initial">重新选择</button><button class="action primary" data-done>回到聊天</button>`}
else{let banner=current==='error'?'<div class="banner error" role="alert"><strong>还没保存成功</strong>你的选择仍留在这里。请稍后再试。</div>':current==='conflict'?'<div class="banner" role="alert"><strong>偏好已在另一处更新</strong>这份草稿尚未覆盖新选择。先查看最新偏好，再决定如何调整。<div><button class="action" data-latest>查看最新偏好</button></div></div>':current==='saved'?'<div class="banner" role="status"><strong>已保存，下次回复开始使用</strong>当前正在生成的回复不受影响。</div>':'';
content=banner+groups()+`<div class="summary"><strong>${current==='initial'?'没有标准答案':'这些是表达偏好，不是人物设定'}</strong><p>三项可以自由组合；伙伴仍可以有不同意见、拒绝或安静陪伴。</p></div>`;
footer=current==='initial'?'<button class="action" data-done>先聊聊，稍后再选</button><button class="action primary" data-save disabled>保存选择</button>':`<button class="text-button" data-state="history" ${current==='saving'?'disabled':''}>版本记录</button><button class="text-button" data-state="clear" ${current==='saving'?'disabled':''}>清除偏好</button><button class="action primary" data-save ${current==='saving'||current==='conflict'?'disabled':''}>${current==='saving'?'正在保存…':current==='error'?'重试保存':'保存修改'}</button>`}
document.querySelector('.card').innerHTML=head+`<div class="body">${content}</div><footer class="foot">${footer}</footer><p id="demo-status" class="sr" aria-live="polite"></p>`;
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));document.querySelectorAll('input').forEach(r=>r.onchange=()=>{values[r.name]=r.value;const save=document.querySelector('[data-save]');if(save&&current!=='conflict')save.disabled=false});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>render('saved',true));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>document.getElementById('demo-status').textContent='设计演示结束；未保存或发送数据。');document.querySelectorAll('[data-latest]').forEach(b=>b.onclick=()=>{b.closest('.banner').innerHTML='<strong>最新已保存：自然 · 热闹 · 适中</strong>你的草稿：可爱 · 安静 · 简短。请返回后重新调整，不自动覆盖。<div><button class="action" data-back-to-edit>返回调整</button></div>';document.querySelector('[data-back-to-edit]').onclick=()=>render('edit')});document.querySelectorAll('[data-confirm-restore]').forEach(b=>b.onclick=()=>{values={tone:'NATURAL',energy:'LIVELY',verbosity:'BALANCED'};render('saved',true)});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>document.getElementById('restore-confirm').hidden=false)}
render(current);
</script></body></html>
