# Copy to config.yaml. Secrets and GSV runtime asset paths belong in .env and are managed by Settings Center.
base_url: "https://opencode.ai/zen/go/v1"
# OpenCode Go model id. deepseek-flash is used for text and image turns by default.
chat_model: "deepseek-flash"
# Optional compatibility override for providers that still require a dedicated vision model.
# Leave empty to reuse chat_model for image input.
vision_model: ""
chat_temperature: 0.7
llm_attempts: 2

# Real semantic embeddings are enabled from Day 1. Runtime loading is strict-offline;
# run scripts/setup-media-models.sh (or prefetch_embedding_model.py) before normal startup.
embedding_provider: "sentence-transformers"
embedding_model: "BAAI/bge-small-zh-v1.5"
# Alternative for any provider exposing POST /embeddings:
# embedding_provider: "openai-compatible"
# embedding_base_url: "https://your-provider/v1"
# embedding_model: "your-embedding-model"

# Formal chat TTS. Provider Lab :9002 remains available for audition/benchmark.
# Qwen3-TTS is not a formal realtime chat provider. Its isolated :9013 runtime
# is reserved for experiments/future voice-design tooling.
tts_provider: "kokoro"       # kokoro | edge | gsv | sherpa
tts_voice: "zf_001"          # Provider-specific voice selected from the healthy provider inventory in Settings
tts_speed: 1.0               # Edge maps 0.5..2.0 to -50%..+100%
tts_device: "cpu"            # Desired local device. GSV hot-reloads; Kokoro(:9002)/Sherpa(:8001) require only that owning runtime to restart.

# Shared Search provider: image discovery for Avatar/Space plus web discovery for
# World Observation. It is not exposed as an arbitrary Direct/Group browser tool.
# Keys live in .env.
search_provider: "searchapi"
search_country: "jp"
search_language: "zh-cn"
search_safe_search: "strict"

# World Observation uses a real headless browser after search discovery.
# "auto" tries Playwright Chromium first, then installed desktop Chrome.
web_browser_channel: "auto"             # auto | chromium | chrome
web_browser_timeout_seconds: 20
web_browser_render_wait_ms: 700          # allow JS-rendered article content to appear
# Brave remains available as an optional fallback:
# search_provider: "brave"
# search_country: "ALL"
# search_language: "zh"
# General Web Search discovery is now used only by World Observation.
# The character never receives a generic arbitrary browser tool in private chat.

# Character autonomous ImageGen and the guided chat image tool share this provider config.
# Dev Console provides the provider-oriented diagnostics surface.
image_generation_provider: "agnes"   # agnes | msimg
image_generation_timeout_seconds: 180
agnes_base_url: "https://apihub.agnes-ai.com/v1"
agnes_image_model: "agnes-image-2.1-flash"
# For the complete local dev environment run: bash scripts/sync-all.sh
# Comma-separated model aliases/ModelScope model IDs. Multiple values enable failover.
msimg_models: "qwen"

db_path: "data/character-memory.db"
# Empty means <db parent>/media. User-uploaded and generated image bytes live here, not in SQLite.
media_dir: ""
media_max_bytes: 8388608
# Empty means <db parent>/stickers. Web-imported sticker packs are global to all characters/groups.
sticker_dir: ""
# Empty means <db parent>/avatars. Current avatars are copied locally regardless of source.
avatar_dir: ""
avatar_max_bytes: 8388608
persona_path: "personas/rin/persona.yaml"
recall_limit: 8

# Direct-character wake. The background loop checks periodically, but the model is
# only called when a character reaches this interval. Manual Wake ignores the
# interval. Wake may speak, create an Intent, or stay silent. TIME_TICK /
# PROACTIVE_INTENT do not spend ImageGen quota automatically.
proactive_wake_enabled: true
proactive_wake_minutes: 60

# Due-Intent dispatch. A character's due Intent is re-evaluated by the model, and
# that round may itself leave another Intent. The cooldown, the delay floor and the
# pending ceiling below are the server-side bounds that keep that from becoming a
# self-sustaining loop; the model cannot raise them.
proactive_dispatch_enabled: true
proactive_poll_seconds: 30                    # check latency only; does not change the dispatch interval
proactive_min_dispatch_interval_minutes: 60   # per character; silence consumes it too (the call was already paid for)
proactive_intent_min_delay_minutes: 10        # floor for a new intent's earliest_at; 0 disables the floor
proactive_max_pending_intents: 20             # per character; 0 = unlimited
proactive_intent_dedup_enabled: true          # drop an intent that repeats a recent one
proactive_intent_duplicate_similarity: 0.90   # cosine threshold for "repeats"
proactive_intent_dedup_window_hours: 72       # how far back duplicate detection looks

# Character Space autonomous social life. The model may decide not to post on
# any opportunity, and a character may publish several posts in one day when the
# interval is short. Production default is one opportunity every 24H; test soak
# runs can shorten this to 60/30/10 minutes from Dev Console.
space_autonomy_enabled: true
space_opportunity_interval_minutes: 1440  # 1440=24H, 60=1H, 30=30min, 10=10min
space_max_posts_per_day: 0                # publishing ceiling per local day; 0 = unlimited
space_media_enabled: true                 # character may naturally choose images or one voice post via formal TTS
space_media_max_items: 3                  # execution cap per post; hard max 9
space_image_search_enabled: true          # use configured image-search provider
space_image_generation_enabled: true      # use configured ImageGen provider
space_world_observation_enabled: true     # character may choose to explore public web
space_world_max_pages: 2                  # headless-rendered pages per opportunity; hard max 4
space_world_max_chars_per_page: 6000      # extracted readable text cap for each page
space_audience_size: 5                    # 0 disables automatic distribution; hard max 10
space_scheduler_poll_seconds: 60          # check latency only; does not change interval

# World Activity runs independently from Space posting. Pulse reads bounded
# aggregation/trending pages; Personal Browse lets each Character observe the
# public web without automatically posting or writing long-term Memory.
world_activity_enabled: true
world_pulse_enabled: true
world_pulse_sources:
  - "https://tophub.today/"
  - "https://news.ycombinator.com/"
  - "https://github.com/trending"
world_pulse_refresh_minutes: 60
world_pulse_discussion_interval_minutes: 360
world_pulse_source_max_chars: 8000
world_pulse_max_topics: 8
world_pulse_commenter_count: 4
world_browse_enabled: true
world_browse_interval_minutes: 30  # 30m current baseline; each active character has an independent clock
world_browse_max_pages: 2
# Per active character, per local day. Every browse spends one paid web search
# from the quota every character shares, so the interval above is not a bound by
# itself: 30 minutes authorises 48 a day. 0 means no ceiling.
world_browse_daily_max: 10
world_activity_poll_seconds: 60

# Autonomous Group Chat. One due opportunity chooses one rotating seed member;
# if that member naturally speaks, at most a few other members may respond once.
# New user messages always take priority. No infinite character-to-character loop.
group_autonomy_enabled: true
group_autonomy_interval_minutes: 360       # 6H production baseline; 10/30/60 useful for soak tests
group_autonomy_max_messages: 3             # hard range 1..4 visible character messages per opportunity
group_autonomy_user_quiet_minutes: 30      # skip/rearm when the user spoke too recently; 0 disables this guard
group_autonomy_poll_seconds: 60            # check latency only; does not change interval

# Group user-turn speaker cap. One user message asks at most this many distinct
# members to react. @-mentioned members always participate; unmentioned members
# are truncated from the tail of the rotating order, so the audience still
# rotates across turns. Set to 12 to restore the every-member-is-asked behavior.
group_max_speakers_per_turn: 5

# Random Encounter. Candidates live outside the formal chat list until the user
# explicitly keeps one. Formal characters warn after 10 active entries and hard-stop at 20;
# a full list does not stop discovery or temporary encounter chat.
encounter_enabled: true
encounter_interval_minutes: 1440           # 24H default; 10/30/60 useful for soak tests
encounter_web_probability: 0.5             # WEB vs system-generated candidate selection
encounter_poll_seconds: 60                 # scheduler check latency only
encounter_max_pending: 3                   # do not accumulate an endless unseen candidate pile


# GSV-TTS-Lite runtime assets are intentionally NOT stored in config.yaml.
# Configure them in Settings Center; they persist to project-local .env:
# GSV_TTS_GPT_MODEL="C:/path/to/voice.ckpt"
# GSV_TTS_SOVITS_MODEL="C:/path/to/voice.pth"
# GSV_TTS_VOICE="murasame"    # default template, i.e. voices/murasame.yaml
# The reference audio and its transcript are not environment values: each
# template under voices/ holds its own, with ref_audio relative to voices/.
