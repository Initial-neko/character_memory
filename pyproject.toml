[project]
name = "character-memory"
version = "0.4.1"
description = "Experimental persistent AI person runtime with language memory, vector recall and simulated life."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
media = ["sherpa-onnx>=1.13.5,<1.14"]
ui = ["streamlit>=1.37"]
dev = ["pytest>=8.0"]
all = [
  "sentence-transformers>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sherpa-onnx>=1.13.5,<1.14",
  "streamlit>=1.37",
  "pytest>=8.0",
]

[project.scripts]
character-memory = "character_memory.cli:main"
character-media = "character_memory.media_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
character_memory = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/stickers/default/*.yaml",
  "web/stickers/default/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
