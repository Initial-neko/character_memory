[project]
name = "character-memory"
version = "0.5.0rc1"
description = "Experimental persistent AI person runtime with language memory, vector recall and simulated life."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "numpy==2.5.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
# These optional stacks are not part of the current Voice V0 compatibility
# baseline yet. Keep them bounded until they have their own tested lock step.
local-embedding = ["sentence-transformers>=3.0,<6"]
api = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]
# sherpa-onnx is the Python binding. sherpa-onnx-core carries the matching
# native shared libraries (including ONNX Runtime on Windows). Keep both direct
# and version-aligned so mirrors/lockfiles cannot silently omit the native core.
media = [
  "sherpa-onnx==1.13.5",
  "sherpa-onnx-core==1.13.5",
]
# Kokoro belongs to the canonical local stack now that :9002 exposes it as a
# supported audition/provider service. Model weights are prefetched explicitly
# by scripts/setup-media-models.sh so normal synthesis never downloads on demand.
tts-kokoro = [
  "kokoro>=0.9.4,<1",
  "misaki[zh]>=0.9.4,<1",
  "huggingface-hub>=0.30,<2",
]
# Edge TTS is an online provider. Keep the Python client explicit and pinned;
# unlike local providers it needs network access at synthesis time.
tts-edge = [
  "edge-tts==7.2.8",
]
# Agnes uses the core httpx dependency. msimg stays opt-in when selecting only
# the image-generation extra, but it is also part of the canonical `all` dev
# stack below so `uv sync --extra all` keeps Voice/API/ImageGen together.
image-generation = ["msimg==0.0.4"]
ui = ["streamlit>=1.37,<2"]
dev = ["pytest==9.1.1"]
browser = ["playwright>=1.55", "pytest-playwright>=0.7"]
all = [
  "sentence-transformers>=3.0,<6",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "sherpa-onnx==1.13.5",
  "sherpa-onnx-core==1.13.5",
  "kokoro>=0.9.4,<1",
  "misaki[zh]>=0.9.4,<1",
  "huggingface-hub>=0.30,<2",
  "edge-tts==7.2.8",
  "msimg==0.0.4",
  "streamlit>=1.37,<2",
  "pytest==9.1.1",
  "playwright>=1.55",
]

[project.scripts]
character-memory = "character_memory.cli:main"
character-media = "character_memory.media_bootstrap:main"
character-dev = "character_memory.dev_server:main"
character-settings = "character_memory.settings_server:main"
character-tts-lab = "character_memory.tts_lab:main"
character-stack = "character_memory.dev_stack:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
character_memory = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/stickers/default/*.yaml",
  "web/stickers/default/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "browser: real-browser smoke tests run in the dedicated CI browser job",
]
